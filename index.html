<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEPENGURUSAN PKS PERIODE 2025/2026</title>

<style>
:root {
    --navy:#001f3f;
    --blue:#0074D9;
    --light-blue:#7FDBFF;
    --white:#ffffff;
}

/* BODY & BACKGROUND */
body{
    position:relative;
    margin:0;
    padding:20px;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:0;
}

/* Background paling belakang */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjwhIxXOHruPYfsCMwXP_i95oezTti80LDVwdJ2HI7-tnp6veqZPztsrKSBvZiagVINHutfdo6i7c14G5bSNRerRwYy9EgOG8Tojj8uYS1BCREr5s5YIFPNdsVmoXUx2FMYvQ6uPhk_n1MuhICV4-ELq1Zk_OQ9FpGEEcd8wgkkjQA1nArHb2Iwqof0tuE/s1600/1000417367.png");
    background-size:cover;
    background-position:center;
    z-index:-2;
}

/* Overlay */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,31,63,.75);
    z-index:-1;
}

h1{
    color:white;
    text-align:center;
    margin-bottom:40px;
    letter-spacing:2px;
    text-shadow:2px 2px 6px rgba(0,0,0,.7);
}

.container{
    width:100%;
    max-width:1200px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
    border-top:6px solid var(--navy);
    transition:.25s;
}
.card:hover{transform:translateY(-5px);}

.position{
    background:var(--light-blue);
    color:var(--navy);
    padding:6px 14px;
    border-radius:20px;
    font-size:.85rem;
    font-weight:bold;
    margin-bottom:15px;
}

.photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--light-blue);
    margin-bottom:15px;
}

.order{color:var(--blue);font-weight:bold;}
.name{font-size:1.4rem;font-weight:bold;color:var(--navy);}
.votes{font-size:2.6rem;font-weight:bold;color:var(--navy);margin:10px 0;}

.controls{
    display:flex;
    justify-content:center;
    gap:18px;
}

button{
    width:45px;
    height:45px;
    border-radius:50%;
    border:none;
    font-size:1.6rem;
    cursor:pointer;
    color:white;
}

.minus{background:#ff4136;}
.plus{background:#2ecc40;}

button:active{transform:scale(.9);}
</style>
</head>

<body>

<h1>KEPENGURUSAN PKS PERIODE 2025/2026</h1>
<div class="container" id="container"></div>

<script>
/* ===============================
   DATA & LOCAL STORAGE
   =============================== */
const STORAGE_KEY = "pks_voting_data";

const positions = [
    "KETUA PKS",
    "WAKIL KETUA 1 PKS",
    "WAKIL KETUA 2 PKS",
    "SEKERTARIS PKS",
    "BENDAHARA PKS"
];

let candidates = [
    {id:1,name:"LABA",votes:0,order:1,photo:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh0tmHzJCyb2P__CxPLZkWbU9HK2tIAYt9NS-cs19A5SgozIO29R4ixIC6qbZo1qaJHaiGU6XCSygQLD0vPAXfQ6D15POvd5vTs4hjfg_B1xPdy4tdOgHX62_uUGI8EmSPwgkHy2XDnTFHH6jMR22_L5ch6thwcVRRivURYlqaUTIAfy8137dM3JH5YpNo/s1600/1000417351.jpg"},
    {id:2,name:"RISMA",votes:0,order:2,photo:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjSqJSEiJnd-pVyeWevwZZa-aFxgwMp7C1aHN4gJg3_lm9WSWKa2-_XsHigNykhh5x-2CuL_hg1AGObsIswsNvNifOYVqxzEqEjpMK9ZCc7PZwvpSIoQk_j0O7fuxKcgxQdHVUs-qBpdyFb1sDWLG0D-MMM_VfSYnpQjjrR4d9CJmRLQWhzV2txOZwvGj8/s1600/1000417348.jpg"},
    {id:3,name:"ARYA",votes:0,order:3,photo:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhZ6wF-nBIwHLYFZiwcluqr18SjMVgju2rlxzr3cZPFJPwMCKCZOT8SthEdKlq1TQoZ9L13eYEVdY4g4tmGP-L-mPL2Irk2i5njontfq9ox5RdtGbxBBRr-8VFJgj3N7neyvkEQqpg0PaZmuFEJ0nliAIoy9ybHJEfFUoOpDIyzdeIfkhpd_o-QBjR5eX4/s1600/1000417349.jpg"},
    {id:4,name:"MESYA",votes:0,order:4,photo:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjxzqFgNP1pf5Xg7XHm1WvgSxMJBxUxwTZTrfrZLcAij9epwUXPGlBOFAwiAbLhmtNf-5EYpncWpoRQM8wqQK9X-xzoo4oeJXJzZl78KQAIHrpOK15snI-NHOmJjLhi0fxqPBK6wU3juQ-O33CU2KvLurmPdWRtPcGGmM3lkQhPyZOHYrJUO0TfEIrReXo/s1600/1000417350.jpg"},
    {id:5,name:"AME",votes:0,order:5,photo:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgqw3FXgRXNiyvxl9d2G-J75_h_FzIfkzxPbdvUIql-aVEUISJNvOp7AUaOlBxm2dI6MaEzDNP-Ml5a_pK1KavU4fjwZx-vT-CWuAhXmpWprSYuxgSS9iZ9JzQLuDB3NvW3zUvkKNfBpWrj51f3hMO-Q5EoGpPn1hqOSywAUWsOx_WH9R3BlZhcIEAmoAM/s1600/1000417347.jpg"}
];

/* LOAD */
function loadStorage(){
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
        const data = JSON.parse(saved);
        data.forEach(d=>{
            const c = candidates.find(x=>x.id===d.id);
            if(c) c.votes = d.votes;
        });
    }
}

/* SAVE */
function saveStorage(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(candidates));
}

/* UI */
function updateUI(){
    const container=document.getElementById("container");
    container.innerHTML="";

    const uniqueVotes=[...new Set(candidates.map(c=>c.votes))]
        .filter(v=>v>0)
        .sort((a,b)=>b-a);

    const voteToPosition={};
    uniqueVotes.forEach((v,i)=>voteToPosition[v]=positions[i]||"-");

    candidates.forEach(c=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <div class="position">${voteToPosition[c.votes]||"-"}</div>
            <img class="photo" src="${c.photo}">
            <div class="order">No. Urut ${c.order}</div>
            <div class="name">${c.name}</div>
            <div class="votes">${c.votes}</div>
            <div class="controls">
                <button class="minus" onclick="vote(${c.id},-1)">−</button>
                <button class="plus" onclick="vote(${c.id},1)">+</button>
            </div>`;
        container.appendChild(card);
    });
}

/* VOTING */
function vote(id,val){
    const c=candidates.find(x=>x.id===id);
    if(!c) return;
    c.votes+=val;
    if(c.votes<0) c.votes=0;
    saveStorage();
    updateUI();
}

loadStorage();
updateUI();
</script>

</body>
</html>
