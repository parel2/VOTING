<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEMILIHAN KETUA PKS</title>

<style>
/* ===== BACKGROUND PALING BELAKANG ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjwhIxXOHruPYfsCMwXP_i95oezTti80LDVwdJ2HI7-tnp6veqZPztsrKSBvZiagVINHutfdo6i7c14G5bSNRerRwYy9EgOG8Tojj8uYS1BCREr5s5YIFPNdsVmoXUx2FMYvQ6uPhk_n1MuhICV4-ELq1Zk_OQ9FpGEEcd8wgkkjQA1nArHb2Iwqof0tuE/s1600/1000417367.png")
              no-repeat center center fixed;
  background-size: cover;
}

/* overlay agar teks terbaca */
.overlay {
  background: rgba(10, 25, 60, 0.85);
  min-height: 100vh;
  padding: 20px;
}

/* ===== JUDUL ===== */
h1 {
  text-align: center;
  color: #a8d8ff;
  margin-bottom: 30px;
}

/* ===== KARTU CALON ===== */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #0b1d3a;
  color: white;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

.role {
  margin-top: 8px;
  font-weight: bold;
  color: #7fd1ff;
}

.vote {
  font-size: 22px;
  margin: 10px 0;
}

/* ===== TOMBOL ===== */
.buttons button {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  font-size: 22px;
  cursor: pointer;
  margin: 5px;
}

.minus {
  background: #ff6b6b;
  color: white;
}

.plus {
  background: #4cd3ff;
  color: #002244;
}

/* ===== RESET ===== */
.reset {
  margin-top: 30px;
  text-align: center;
}

.reset button {
  padding: 12px 25px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #ff3b3b;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="overlay">

<h1>PEMILIHAN KETUA PKS</h1>

<div class="container" id="list"></div>

<div class="reset">
  <button onclick="resetVoting()">RESET VOTING</button>
</div>

</div>

<script>
/* ===== DATA CALON ===== */
let candidates = [
  {id:1, name:"Calon 1", img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh0tmHzJCyb2P__CxPLZkWbU9HK2tIAYt9NS-cs19A5SgozIO29R4ixIC6qbZo1qaJHaiGU6XCSygQLD0vPAXfQ6D15POvd5vTs4hjfg_B1xPdy4tdOgHX62_uUGI8EmSPwgkHy2XDnTFHH6jMR22_L5ch6thwcVRRivURYlqaUTIAfy8137dM3JH5YpNo/s1600/1000417351.jpg", votes:0},
  {id:2, name:"Calon 2", img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjSqJSEiJnd-pVyeWevwZZa-aFxgwMp7C1aHN4gJg3_lm9WSWKa2-_XsHigNykhh5x-2CuL_hg1AGObsIswsNvNifOYVqxzEqEjpMK9ZCc7PZwvpSIoQk_j0O7fuxKcgxQdHVUs-qBpdyFb1sDWLG0D-MMM_VfSYnpQjjrR4d9CJmRLQWhzV2txOZwvGj8/s1600/1000417348.jpg", votes:0},
  {id:3, name:"Calon 3", img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhZ6wF-nBIwHLYFZiwcluqr18SjMVgju2rlxzr3cZPFJPwMCKCZOT8SthEdKlq1TQoZ9L13eYEVdY4g4tmGP-L-mPL2Irk2i5njontfq9ox5RdtGbxBBRr-8VFJgj3N7neyvkEQqpg0PaZmuFEJ0nliAIoy9ybHJEfFUoOpDIyzdeIfkhpd_o-QBjR5eX4/s1600/1000417349.jpg", votes:0},
  {id:4, name:"Calon 4", img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjxzqFgNP1pf5Xg7XHm1WvgSxMJBxUxwTZTrfrZLcAij9epwUXPGlBOFAwiAbLhmtNf-5EYpncWpoRQM8wqQK9X-xzoo4oeJXJzZl78KQAIHrpOK15snI-NHOmJjLhi0fxqPBK6wU3juQ-O33CU2KvLurmPdWRtPcGGmM3lkQhPyZOHYrJUO0TfEIrReXo/s1600/1000417350.jpg", votes:0},
  {id:5, name:"Calon 5", img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgqw3FXgRXNiyvxl9d2G-J75_h_FzIfkzxPbdvUIql-aVEUISJNvOp7AUaOlBxm2dI6MaEzDNP-Ml5a_pK1KavU4fjwZx-vT-CWuAhXmpWprSYuxgSS9iZ9JzQLuDB3NvW3zUvkKNfBpWrj51f3hMO-Q5EoGpPn1hqOSywAUWsOx_WH9R3BlZhcIEAmoAM/s1600/1000417347.jpg", votes:0}
];

/* ===== LOAD DARI LOCAL STORAGE ===== */
const saved = localStorage.getItem("pks_votes");
if (saved) candidates = JSON.parse(saved);

/* ===== RENDER ===== */
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  candidates.forEach(c => {
    list.innerHTML += `
      <div class="card">
        <div class="role" id="role-${c.id}">-</div>
        <img src="${c.img}">
        <h3>${c.name}</h3>
        <div>Nomor Urut: ${c.id}</div>
        <div class="vote" id="vote-${c.id}">${c.votes}</div>
        <div class="buttons">
          <button class="minus" onclick="minus(${c.id})">−</button>
          <button class="plus" onclick="plus(${c.id})">+</button>
        </div>
      </div>`;
  });
  updateRole();
}

/* ===== VOTING ===== */
function plus(id){
  candidates.find(c=>c.id===id).votes++;
  save();
}
function minus(id){
  let c = candidates.find(c=>c.id===id);
  if(c.votes>0) c.votes--;
  save();
}

/* ===== SIMPAN ===== */
function save(){
  localStorage.setItem("pks_votes", JSON.stringify(candidates));
  render();
}

/* ===== JABATAN ===== */
function updateRole(){
  const roles = [
    "KETUA PKS",
    "WAKIL KETUA 1",
    "WAKIL KETUA 2",
    "SEKRETARIS PKS",
    "BENDAHARA PKS"
  ];
  const sorted = [...candidates].sort((a,b)=>b.votes-a.votes);
  sorted.forEach((c,i)=>{
    document.getElementById("role-"+c.id).innerText =
      c.votes>0 ? roles[i] : "-";
  });
}

/* ===== RESET ===== */
function resetVoting(){
  if(confirm("Yakin reset semua suara?")){
    candidates.forEach(c=>c.votes=0);
    save();
  }
}

render();
</script>

</body>
</html>
